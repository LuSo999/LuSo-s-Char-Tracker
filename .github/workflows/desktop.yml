name: Desktop app release

# Push a tag like "desktop-v0.1.0" to build installers for Windows, macOS and Linux and
# attach them to a GitHub release (Releases page of the repository).
on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm ci
        working-directory: desktop
      - run: npm run dist
        working-directory: desktop
        env:
          # No paid signing certificate: Windows SmartScreen / macOS Gatekeeper will ask once.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v5
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/release/*.AppImage
            desktop/release/*.exe
            desktop/release/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: LuSo Sheet Tool ${{ github.ref_name }}
          body: |
            Desktop app for filling any character sheet PDF from a LuSo's Char Tracker character, and reading filled sheets back.
            Windows: LuSo-Sheet-Tool-…-win-x64.exe · macOS: …-mac-arm64.dmg (Apple silicon) or …-mac-x64.dmg (Intel) · Linux: …-linux-x86_64.AppImage
            See docs/desktop-app.md for first-start notes (unsigned app).
          files: installers/*
